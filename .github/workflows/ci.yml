name: Projeto ALPHA - Quality Gate

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Validate, Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: alpha_test
          POSTGRES_USER: alpha
          POSTGRES_PASSWORD: alpha_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alpha -d alpha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://alpha:alpha_test_password@localhost:5432/alpha_test?schema=public
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-admin-password
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Validate Prisma schema
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prepare test database
        run: npx prisma db push --schema=prisma/schema.prisma --skip-generate

      - name: Format check
        run: npm run format:check

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Production build
        run: npm run build
