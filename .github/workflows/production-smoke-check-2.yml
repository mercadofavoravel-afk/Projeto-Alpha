name: Production Smoke Check 2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke-check-2.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect redirect chains
        shell: bash
        run: |
          set -euo pipefail
          for url in             "https://www.imoveisdealtopadraorio.com.br/"             "https://www.imoveisdealtopadraorio.com.br/zona-sul/"             "https://www.imoveisdealtopadraorio.com.br/alpha"             "https://www.imoveisdealtopadraorio.com.br/alpha/empreendimentos"             "https://www.imoveisdealtopadraorio.com.br/alpha/robots.txt"             "https://www.imoveisdealtopadraorio.com.br/alpha/sitemap.xml"
          do
            echo "===== $url ====="
            curl -sSIL --max-redirs 5 --connect-timeout 10 --max-time 30 "$url"               | grep -Ei '^(HTTP/|location:|server:|cf-ray:|x-vercel-id:)' || true
            echo
          done

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production smoke test
        run: node scripts/smoke-production.mjs
