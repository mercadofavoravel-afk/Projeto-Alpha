name: Production Smoke Check 2

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke-check-2.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production smoke test
        run: node scripts/smoke-production.mjs
