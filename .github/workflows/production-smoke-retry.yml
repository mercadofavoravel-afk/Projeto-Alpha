name: Production Smoke Retry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke-retry.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run smoke:production
