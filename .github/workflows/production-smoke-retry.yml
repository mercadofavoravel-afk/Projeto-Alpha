name: Production Smoke Retry

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/production-smoke-retry.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check www and apex without following redirects
        shell: bash
        run: |
          set -euo pipefail
          for url in             "https://www.imoveisdealtopadraorio.com.br/alpha"             "https://imoveisdealtopadraorio.com.br/alpha"             "https://www.imoveisdealtopadraorio.com.br/alpha/robots.txt"             "https://www.imoveisdealtopadraorio.com.br/alpha/sitemap.xml"; do
            echo "=== $url"
            curl -sS -I --max-time 20 "$url" | sed -n '1,12p'
          done
